<title>Book Your Dream Destination</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&display=swap');

  /* Halaman ini sengaja berkomitmen pada satu dunia visual (putih -> emas),
     jadi semua warna dicat eksplisit dan tidak mengikuti tema host. */
  :root {
    color-scheme: light;

    --ground-top: #FFFFFF;
    --ground-bottom: #ECC485;
    --ink: #1A1A1A;
    --ink-soft: #3A3A3A;
    --gold-deep: #8A5A20;
    --bezel: #111111;
    --stage: #D8CBB6;

    --font: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--stage);
    font-family: var(--font);
  }

  /* ---------- Rangka handphone generik (Android) ---------- */
  .phone {
    position: relative;
    width: min(380px, 100%);
    aspect-ratio: 9 / 19;
    background: var(--bezel);
    border-radius: 40px;
    padding: 10px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  }

  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 31px;
    overflow: hidden;
    background: linear-gradient(180deg, var(--ground-top) 0%, var(--ground-bottom) 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 7%;
    padding: 7% 8%;
  }

  /* Kamera bulat kecil di tengah atas */
  .camera {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #0B0B0B;
    box-shadow: inset 0 0 0 1.5px #2E2E2E;
    z-index: 5;
  }

  /* ---------- 1 & 2. Judul dan subjudul (rata kiri) ---------- */
  .intro {
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: left;
  }

  .title {
    margin: 0;
    font-size: clamp(22px, 7.4vw, 30px);
    font-weight: 800;
    line-height: 1.14;
    letter-spacing: -.01em;
    color: var(--ink);
    text-transform: uppercase;
    text-wrap: balance;
  }

  .subtitle {
    margin: 0;
    font-size: clamp(10px, 3.1vw, 12.5px);
    font-weight: 400;
    line-height: 1.45;
    color: var(--ink-soft);
  }

  /* ---------- 3. Tiga lingkaran foto yang bertumpuk ---------- */
  .collage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / .81;
  }

  .circle {
    position: absolute;
    width: 52%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 5px solid #FFFFFF;
    overflow: hidden;
    background: #FFFFFF;
    box-shadow: 0 6px 16px rgba(90, 62, 20, .18);
  }

  .circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .circle--left  { left: 0;  top: 0; z-index: 1; }
  .circle--right { right: 0; top: 0; z-index: 2; }
  /* Lingkaran bawah menimpa pertemuan kedua lingkaran atas */
  .circle--bottom { left: 24%; top: 29%; z-index: 3; }

  /* ---------- 4 & 5. Tombol LOGIN dan tautan daftar ---------- */
  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .login {
    display: block;
    width: 100%;
    padding: 15px 20px;
    border: 0;
    border-radius: 999px;
    background: #FFFFFF;
    color: var(--ink);
    font-family: var(--font);
    font-size: clamp(13px, 3.8vw, 15px);
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(90, 62, 20, .20);
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .login:hover {
    transform: translateY(-1px);
    box-shadow: 0 9px 22px rgba(90, 62, 20, .26);
  }

  .login:active { transform: translateY(0); }

  .signup {
    margin: 0;
    text-align: center;
    font-size: clamp(9.5px, 2.9vw, 11.5px);
    font-weight: 400;
    color: var(--ink-soft);
  }

  .signup a {
    color: var(--gold-deep);
    font-weight: 700;
    text-decoration: none;
  }

  .signup a:hover { text-decoration: underline; }

  :focus-visible {
    outline: 2px solid var(--gold-deep);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .login { transition: none; }
    .login:hover { transform: none; }
  }
</style>

<div class="phone">
  <span class="camera"></span>

  <div class="screen">

    <div class="intro">
      <h1 class="title">Book Your Dream<br>Destination</h1>
      <p class="subtitle">Bepergian Dengan Nyaman, Aman, dan Terpercaya</p>
    </div>

    <div class="collage">

      </div>

      <div class="circle circle--bottom">
        <!-- ganti src dengan foto balon udara Cappadocia -->
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3ClinearGradient id='c' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23F6C98A'/%3E%3Cstop offset='1' stop-color='%23A2622F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='200' height='200' fill='url(%23c)'/%3E%3Cpath d='M0 150 Q50 126 100 142 Q150 158 200 136 L200 200 L0 200 Z' fill='%238A4F26'/%3E%3Cellipse cx='96' cy='66' rx='30' ry='34' fill='%23E2653C'/%3E%3Crect x='91' y='102' width='10' height='9' fill='%235C3317'/%3E%3Cellipse cx='148' cy='94' rx='17' ry='19' fill='%23E8A33D'/%3E%3Cellipse cx='48' cy='104' rx='13' ry='15' fill='%23D9534F'/%3E%3Ctext x='100' y='184' font-family='sans-serif' font-size='14' fill='%23FFFFFF' text-anchor='middle'%3ECAPPADOCIA%3C/text%3E%3C/svg%3E" alt="Balon udara di Cappadocia, Turki">
      </div>
    </div>

    <div class="actions">
      <button class="login" type="button">Login</button>
      <p class="signup">Belum Punya akun? <a href="#daftar">Daftar</a></p>
    </div>

  </div>
</div>
